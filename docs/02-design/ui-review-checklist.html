<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCat Publisher Desktop — 问题归类与逐图 Review 清单</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --accent: #007aff;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .title-wrap h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .title-wrap p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stats {
      font-size: 13px;
      color: var(--muted);
      background: #f2f2f7;
      padding: 6px 12px;
      border-radius: 8px;
    }
    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #f2f2f7; }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { opacity: 0.92; }

    main {
      max-width: 1120px;
      margin: 24px auto 80px;
      padding: 0 20px;
    }
    .category {
      margin-bottom: 32px;
    }
    .category-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .category-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .category-header span {
      font-size: 12px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
      align-items: start;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card.checked {
      border-color: rgba(52, 199, 89, 0.55);
      background: #fbfefb;
    }
    @media (max-width: 760px) {
      .card { grid-template-columns: 1fr; }
    }
    .thumb-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      cursor: zoom-in;
      position: relative;
    }
    .thumb-wrap img {
      width: 100%;
      max-height: 210px;
      object-fit: contain;
      display: block;
    }
    .thumb-caption {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 8px;
      background: #f8f8fa;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .item-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge.done { background: rgba(52,199,89,0.14); color: #1c8a3b; }
    .badge.todo { background: rgba(255,149,0,0.16); color: #b86500; }
    .badge.discuss { background: rgba(0,122,255,0.12); color: #005ec4; }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .check-label input { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; }
    .desc {
      margin: 0 0 10px;
      font-size: 13.5px;
      color: #3a3a3c;
    }
    .fix-plan {
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #f5f7fa;
      border-radius: 8px;
      font-size: 12.5px;
      color: #2c2c2e;
    }
    .note-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
    }
    .note-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }

    .decision-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .decision-card h3 {
      margin: 0 0 8px;
      font-size: 14.5px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13.5px;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      background: #fff;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1d1d1f;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 90;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

    const DECISIONS = [

        title: "Q1. 侧边栏键盘重命名习惯",
        options: [
          "按 Enter 直接进入行内重命名（类似 macOS Finder）",
          "Enter 打开/切入文件，用 F2 / Cmd+R / 右键菜单重命名"
        ]
      },
      {
        id: "D2",
        title: "Q2. 侧边栏是否同步升级为「多级文件夹树」",
        options: [
          "是，本轮一并支持子目录展开/折叠（←/→ 键控制）",
          "否，先保留当前文件列表 + 右键/左右键 + 宽度拖拽"

        id: "D3",
        title: "Q3. 「右下角可以锁定这个面板」具体指哪个面板",
        options: [
          "左下角「操作」弹出面板的右下角增加图钉锁定（锁定后不自动关闭）",
          "编辑区右下角另有一个浮动面板（如字数/大纲浮窗）需要支持锁定"
        ]
      },
      {
        id: "D4",
        title: "Q4. 帖子阅读/点赞/评论数据观测的排期",
        options: [
          "先改完本轮 UI 比例 + 侧边栏左右/右键交互并验收，帖子数据留到 Phase 2",
          "本轮同步预留帖子数据卡片 UI 占位"
        ]
      }

    const STORAGE_KEY = "vcat_ui_review_v1";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"checks":{},"notes":{},"decisions":{},"hideChecked":true}');
    if (state.hideChecked === undefined) state.hideChecked = true;
    if (!state.initializedRound6) {
      for (const cat of CATEGORIES) {
        for (const item of cat.items) {
          if (!item.id.startsWith("T")) {
            state.checks[item.id] = true;
          }
        }
      }
      state.initializedRound6 = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateStats();
    }

    function updateStats() {
      const total = CATEGORIES.reduce((sum, c) => sum + c.items.length, 0);
      const checked = Object.values(state.checks).filter(Boolean).length;
      const pending = total - checked;
      document.getElementById("stats").textContent = `待核验：${pending} 项 · 已完成打勾：${checked} / ${total}`;
      const hideBtn = document.getElementById("toggle-hide-btn");
      if (hideBtn) {
        hideBtn.textContent = state.hideChecked
          ? `已隐藏 ${checked} 项已完成（点击显示全部）`
          : `显示全部中（点击隐藏 ${checked} 项已完成）`;
      }
    }

    function toggleHideChecked() {
      state.hideChecked = !state.hideChecked;
      saveState();
      render();
    }

    function markPreviousDone() {
      for (const cat of CATEGORIES) {
        for (const item of cat.items) {
          if (!item.id.startsWith("T")) {
            state.checks[item.id] = true;
          }
        }
      }
      state.hideChecked = true;
      saveState();
      render();
    }

    function render() {
      const app = document.getElementById("app");
      let html = "";

      for (const cat of CATEGORIES) {
        const sortedItems = [...cat.items].sort(
          (a, b) => Number(!!state.checks[a.id]) - Number(!!state.checks[b.id])
        );
        const visibleItems = state.hideChecked
          ? sortedItems.filter((item) => !state.checks[item.id])
          : sortedItems;
        if (visibleItems.length === 0) continue;

        html += `<section class="category">
          <div class="category-header">
            <h2>${cat.title}</h2>
            <span>${cat.subtitle}</span>
          </div>
          <div class="grid">`;
        for (const item of visibleItems) {
          const isChecked = !!state.checks[item.id];
          const note = state.notes[item.id] || "";
          html += `
            <article class="card ${isChecked ? "checked" : ""}" id="card-${item.id}">
              <div class="thumb-wrap" onclick="openLightbox('${IMG_BASE + item.img}')">
                <img src="${IMG_BASE + item.img}" alt="${item.title}" loading="lazy" />
                <div class="thumb-caption">点击查看大图 · ${item.img}</div>
              </div>
              <div>
                <div class="meta-row">
                  <div class="item-title">
                    <span>${item.title}</span>
                    <span class="badge ${item.status}">${item.statusText}</span>
                  </div>
                  <label class="check-label">
                    <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleCheck('${item.id}', this.checked)" />
                    <span>${isChecked ? "已完成（不用改）" : "未完成（待修改）"}</span>
                  </label>
                </div>
                <p class="desc">${item.desc}</p>
                <div class="fix-plan"><strong>处理方案：</strong>${item.plan}</div>
                <input class="note-input" type="text" placeholder="补充你的意见（例如：还需要调整哪里 / 仍有什么问题）..." value="${note.replace(/"/g, "&quot;")}" oninput="updateNote('${item.id}', this.value)" />
              </div>
            </article>
          `;
        }
        html += `</div></section>`;
      }

      if (!state.hideChecked) {
        html += `<section class="category">
          <div class="category-header">
            <h2>分类 D：动手改代码前的 4 个确认项</h2>
            <span>点选后一并随「复制 Review 结果」导出</span>
          </div>`;
        for (const d of DECISIONS) {
          html += `<div class="decision-card">
            <h3>${d.title}</h3>
            <div class="options">`;
          d.options.forEach((opt, idx) => {
            const checked = state.decisions[d.id] === opt ? "checked" : "";
            html += `<label>
              <input type="radio" name="${d.id}" ${checked} onchange="setDecision('${d.id}', '${opt.replace(/'/g, "\\'")}')" />
              <span>${opt}</span>
            </label>`;
          });
          html += `</div></div>`;
        }
        html += `</section>`;
      }

      app.innerHTML = html;
      updateStats();
    }

    function toggleCheck(id, val) {
      state.checks[id] = val;
      saveState();
      render();
    }

    function updateNote(id, val) {
      state.notes[id] = val;
      saveState();
    }

    function setDecision(id, val) {
      state.decisions[id] = val;
      saveState();
    }

    function openLightbox(src) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").classList.add("open");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    function resetAll() {
      state = { checks: {}, notes: {}, decisions: {} };
      saveState();
      render();
    }

    function exportSummary() {
      let lines = ["# VCat UI Review 确认结果", ""];
      for (const cat of CATEGORIES) {
        lines.push(`## ${cat.title}`);
        const sortedItems = [...cat.items].sort(
          (a, b) => Number(!!state.checks[a.id]) - Number(!!state.checks[b.id])
        );
        for (const item of sortedItems) {
          const mark = state.checks[item.id] ? "[x]" : "[ ]";
          const note = (state.notes[item.id] || "").trim();
          lines.push(`- ${mark} ${item.title}${note ? ` —— 批注：${note}` : ""}`);
        }
        lines.push("");
      }
      lines.push("## 待确认选项");
      for (const d of DECISIONS) {
        lines.push(`- ${d.title}：${state.decisions[d.id] || "（未选择）"}`);
      }
      const text = lines.join("\n");
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2600);
      });
    }

    render();
  </script>
