name: Daily Release PR & Post-Merge Syncback

on:
  schedule:
    - cron: '0 13 * * *' # Daily 21:00 CST (UTC+8)
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    types: [ closed ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily-summary:
    name: Drain, Freeze & Create Daily test -> master PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: merge-test
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test

      - name: Compute 5 Daily KPIs & Create/Update Summary PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            execSync('git fetch origin master test', { stdio: 'inherit' });

            // Ensure freeze lock issue exists to block new PR merges into `test` cleanly
            const openFreeze = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'freeze:release-window',
            });
            let freezeIssueNumber = openFreeze.data[0]?.number ?? null;
            if (!freezeIssueNumber) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: '[Freeze] Daily Release Drain Lock (test -> master)',
                body: '每日 21:00 CST 汇总窗口锁：期间暂停向 `test` 自动合入新切片，待 `test -> master` 合入后自动关闭解锁。',
                labels: ['freeze:release-window'],
              });
              freezeIssueNumber = created.data.number;
            }

            const commitsRaw = execSync('git log origin/master..origin/test --oneline', { encoding: 'utf8' }).trim();
            if (!commitsRaw) {
              console.log('No new commits on test ahead of master; releasing freeze lock.');
              await github.rest.issues.update({ owner, repo, issue_number: freezeIssueNumber, state: 'closed' });
              return;
            }

            const sinceIso = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const closedPrs = await github.rest.pulls.list({ owner, repo, state: 'closed', base: 'test', per_page: 50 });
            const mergedLast24h = closedPrs.data.filter((p) => p.merged_at && p.merged_at >= sinceIso);
            const autoMergedCount = mergedLast24h.filter((p) => !p.labels.some((l) => l.name === 'risk:high')).length;
            const autoMergeRate = mergedLast24h.length > 0 ? `${Math.round((autoMergedCount / mergedLast24h.length) * 100)}% (${autoMergedCount}/${mergedLast24h.length})` : 'N/A (0 merged)';

            let escalatedCount = 0;
            if (fs.existsSync('.harness/slices')) {
              for (const f of fs.readdirSync('.harness/slices')) {
                if (!f.endsWith('.json')) continue;
                const s = JSON.parse(fs.readFileSync(`.harness/slices/${f}`, 'utf8'));
                if (s.status === 'escalated') escalatedCount += 1;
              }
            }

            const revertPrs = closedPrs.data.concat(
              (await github.rest.pulls.list({ owner, repo, state: 'open', base: 'test', per_page: 20 })).data
            ).filter((p) => p.created_at >= sinceIso && p.title.startsWith('[Auto-Revert]'));

            const ratchetLinesTotal = (() => {
              if (!fs.existsSync('.harness/ratchet.json')) return 'N/A';
              const r = JSON.parse(fs.readFileSync('.harness/ratchet.json', 'utf8'));
              const maxSum = Object.values(r.files || {}).reduce((acc, v) => acc + (v.maxLines || 0), 0);
              return `${maxSum} lines across ${Object.keys(r.files || {}).length} hubs`;
            })();

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              per_page: 20,
            });
            const completed24h = runs.data.workflow_runs.filter((r) => r.status === 'completed' && r.created_at >= sinceIso);
            let avgCiSec = 'N/A';
            const sampleRuns = completed24h.slice(0, 5);
            if (sampleRuns.length > 0) {
              const durationsMs = [];
              for (const r of sampleRuns) {
                try {
                  const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: r.id,
                    per_page: 30,
                  });
                  const starts = jobsResp.data.jobs.map((j) => Date.parse(j.started_at)).filter(Number.isFinite);
                  const ends = jobsResp.data.jobs.map((j) => Date.parse(j.completed_at)).filter(Number.isFinite);
                  if (starts.length > 0 && ends.length > 0) {
                    const span = Math.max(...ends) - Math.min(...starts);
                    if (span > 0 && span < 3600 * 1000) {
                      durationsMs.push(span);
                      continue;
                    }
                  }
                } catch {
                  // fall back to workflow run timestamp delta when jobs API fails
                }
                const fallbackStart = Date.parse(r.run_started_at || r.created_at);
                const fallbackEnd = Date.parse(r.updated_at);
                const fallbackSpan = fallbackEnd - fallbackStart;
                if (Number.isFinite(fallbackSpan) && fallbackSpan > 0 && fallbackSpan < 3600 * 1000) {
                  durationsMs.push(fallbackSpan);
                }
              }
              if (durationsMs.length > 0) {
                const avgMs = durationsMs.reduce((a, b) => a + b, 0) / durationsMs.length;
                avgCiSec = `${Math.round(avgMs / 1000)}s`;
              }
            }

            const dateStr = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
            const title = `[Daily Release] test -> master (${dateStr})`;
            const body = [
              `@${owner} 今日 \`test -> master\` 汇总验收单已开启 Drain & Freeze（冻结锁 Issue #${freezeIssueNumber}）。`,
              '',
              '### 📊 每日 5 项健康指标仪表盘',
              '| 指标 | 今日观测值 | 说明 |',
              '| :--- | :--- | :--- |',
              `| **1. 自动合入率** | ${autoMergeRate} | 低/中风险免人工审批直接合入 \`test\` 占比 |`,
              `| **2. 小模型熔断数** | ${escalatedCount} | 连续 2 次失败置 \`escalated\` 切片数 |`,
              `| **3. 合流回归 Auto-Revert** | ${revertPrs.length} | \`test\` 回归触发回滚 PR 次数 |`,
              `| **4. 历史巨型文件棘轮总基线** | ${ratchetLinesTotal} | 只减不增总行数上限 |`,
              `| **5. Ubuntu CI 平均耗时** | ${avgCiSec} | 过去 24h CI 运行均时（${completed24h.length} 次） |`,
              '',
              '### 📝 待验收提交清单 (`master..test`)',
              '```text',
              commitsRaw,
              '```',
              '',
              '> **操作提醒**：请在本地切至 `test` 上手验手感 3 分钟；确认无误后务必选择 **Create a merge commit** 合入 `master`（系统将自动同步回 `test` 并关闭冻结锁）。',
            ].join('\n');

            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'master', head: `${owner}:test` });
            if (existing.data.length > 0) {
              await github.rest.pulls.update({ owner, repo, pull_number: existing.data[0].number, title, body });
            } else {
              await github.rest.pulls.create({ owner, repo, title, head: 'test', base: 'master', body });
            }

  post-merge-syncback:
    name: Sync master back to test, Tag & Unlock Freeze
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.ref == 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # gh workflow run：GITHUB_TOKEN 推的 tag / 开的 PR 不会自动触发工作流
    env:
      # 可选：仓库 secret RELEASE_BOT_TOKEN（细粒度 PAT 或 GitHub App token）。有它时推送与开 PR 都能正常触发 CI；
      # 没有时回退到 GITHUB_TOKEN，并用 workflow_dispatch 显式补跑 CI 和发布。
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      HAS_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Merge master back into test (skip when master adds nothing)
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master test
          # master 只是 test 的合并提交时（日常情况）内容没有差异，回同步只会开一个空 PR 卡在门禁上（#126、#133）。
          if git diff --quiet origin/test...origin/master; then
            echo "master 相对 test 没有新内容，不需要回同步。"
            exit 0
          fi
          git merge --no-ff origin/master -m "chore(release): sync master back to test after daily release"
          if git push origin HEAD:test; then
            exit 0
          fi
          SYNC_BRANCH="sync/master-to-test-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          PR_URL=$(gh pr create --base test --head "${SYNC_BRANCH}" \
            --title "chore(release): sync master back to test" \
            --body "master 上有 test 没有的改动（例如热修复），自动回同步。门禁通过后自动合并。")
          gh pr merge "${PR_URL}" --auto --merge --delete-branch || echo "::warning::未能开启自动合并：${PR_URL}"
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            # GITHUB_TOKEN 开的 PR 上 CI 会停在 action_required；workflow_dispatch 不受此限制，ci-gate 照样记在同一个提交上。
            gh workflow run ci.yml --ref "${SYNC_BRANCH}"
            echo "::notice::已为 ${SYNC_BRANCH} 派发 CI；配置 RELEASE_BOT_TOKEN 后不再需要这一步。"
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Compute next release tag
        id: plan
        run: |
          git fetch origin master --tags --force
          node apps/desktop/scripts/release-plan.mjs next-tag origin/master --github-output

      - name: Tag master and dispatch packaging
        if: steps.plan.outputs.tag != ''
        env:
          NEXT_TAG: ${{ steps.plan.outputs.tag }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          git tag -a "${NEXT_TAG}" origin/master -m "chore(release): ${NEXT_TAG}（${REASON}）"
          git push origin "refs/tags/${NEXT_TAG}"
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            gh workflow run release.yml --ref "${NEXT_TAG}" -f tag="${NEXT_TAG}"
          fi
          echo "### 🏷️ ${NEXT_TAG}（${REASON}）已打在 master，三平台打包已启动" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped tag
        if: steps.plan.outputs.tag == ''
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::notice::本次不打 tag：${REASON}"

      - name: Close freeze:release-window issues
        # always()：回同步或打 tag 失败也要解冻 test，否则冻结锁会一直挂着（#71）。
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const openFreeze = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'freeze:release-window',
            });
            for (const issue of openFreeze.data) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
