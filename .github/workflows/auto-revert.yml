name: Safe Auto-Revert on test Regression

on:
  workflow_run:
    workflows: [ "CI / Build, Unit & E2E Verification" ]
    branches: [ test ]
    types: [ completed ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  safe-auto-revert:
    name: Circuit Pause & Single Revert PR
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Check anti-avalanche lock before reverting
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const openPaused = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'circuit:paused' });
            const openReverts = (await github.rest.pulls.list({ owner, repo, state: 'open', base: 'test' })).data.filter((p) =>
              p.title.startsWith('[Auto-Revert]')
            );
            if (openPaused.data.length > 0 || openReverts.length > 0) {
              console.log('Circuit already paused or open Auto-Revert PR exists; preventing cascade revert.');
              core.setOutput('proceed', 'false');
              return;
            }
            core.setOutput('proceed', 'true');

      - name: Checkout test branch
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: test

      - name: Create revert branch & push
        if: steps.guard.outputs.proceed == 'true'
        id: revert_git
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="revert/test-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git revert -m 1 "$TARGET_SHA" --no-edit || git revert "$TARGET_SHA" --no-edit
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Open circuit:paused issue & single Revert PR
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const shortSha = '${{ steps.revert_git.outputs.short_sha }}';
            const targetSha = '${{ steps.revert_git.outputs.target_sha }}';
            const branch = '${{ steps.revert_git.outputs.branch }}';
            const runUrl = context.payload.workflow_run.html_url;

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: `[Circuit Paused] test regression on ${shortSha}`,
              body: `@${owner} \`test\` 分支合入 \`${targetSha}\` 后回归失败（[CI Log](${runUrl})）。\n\n已开启 \`circuit:paused\` 熔断暂停后续自动合入，并生成唯一回滚 PR。`,
              labels: ['circuit:paused', 'bug'],
            });

            await github.rest.pulls.create({
              owner,
              repo,
              title: `[Auto-Revert] Rollback failing test commit ${shortSha}`,
              head: branch,
              base: 'test',
              body: `@${owner} 自动回滚 \`${targetSha}\` 以恢复 \`test\` 分支绿灯。\n\n关联熔断 Issue: #${issue.data.number}\n失败 CI: ${runUrl}`,
            });
