name: AI Review Stage 2 (Isolated Review)

on:
  workflow_run:
    workflows: [ "AI Review Stage 1 (Diff Extract)" ]
    types: [ completed ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-and-comment:
    name: Stage 2 Isolated AI Review & Monotonic Risk Escalation
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check API key & download diff artifact without checking out Fork code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const apiKey = (process.env.DEEPSEEK_API_KEY || '').trim();

            if (!apiKey) {
              console.log('DEEPSEEK_API_KEY not configured; AI review gracefully skipped without blocking deterministic CI gates.');
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.payload.workflow_run.id,
            });
            const found = artifacts.data.artifacts.find((a) => a.name === 'ai-review-diff');
            if (!found) {
              console.log('No ai-review-diff artifact found.');
              return;
            }

            const zip = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: found.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('diff.zip', Buffer.from(zip.data));
            execSync('unzip -o diff.zip');

            const meta = JSON.parse(fs.readFileSync('meta.json', 'utf8'));
            const diffText = fs.readFileSync('pr.diff', 'utf8');
            if (!diffText.trim() || !meta.prNumber) return;

            const endpoint = (process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1/chat/completions').trim();
            const prompt = [
              'You are a strict senior security and architecture reviewer.',
              'Inspect this git diff ONLY for bugs, IPC/credential leaks, anti-cheat test weakening, or broken cross-module contracts.',
              'Respond strictly in JSON: {"summary": string, "findings": string[], "escalateToHigh": boolean}.',
              '```diff',
              diffText,
              '```',
            ].join('\n');

            const resp = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({
                model: 'deepseek-chat',
                temperature: 0.1,
                response_format: { type: 'json_object' },
                messages: [{ role: 'user', content: prompt }],
              }),
            });

            if (!resp.ok) {
              console.log(`AI Review API returned HTTP ${resp.status}; skipping gracefully.`);
              return;
            }
            const data = await resp.json();
            const content = data.choices?.[0]?.message?.content || '{}';
            let parsed = { summary: '', findings: [], escalateToHigh: false };
            try {
              parsed = JSON.parse(content);
            } catch {
              console.log('AI Review response was not valid JSON; skipping gracefully.');
              return;
            }

            const findingsMd = Array.isArray(parsed.findings) && parsed.findings.length > 0
              ? parsed.findings.map((f) => `- ${f}`).join('\n')
              : '- 未发现明显安全或架构阻断项。';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: meta.prNumber,
              body: `### 🤖 AI Diff Review (Fork-Safe Isolated)\n\n${parsed.summary || ''}\n\n${findingsMd}\n\n${parsed.escalateToHigh ? '> ⚠️ **已单向升级为 `risk:high`**，需 @' + owner + ' 人工 `/approve`。' : ''}`,
            });

            // Monotonic escalation ONLY: never downgrade risk:high
            if (parsed.escalateToHigh === true) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: meta.prNumber, name: 'risk:low' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: meta.prNumber, name: 'risk:mid' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: meta.prNumber, labels: ['risk:high'] });
            }
