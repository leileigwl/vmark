name: Release / Package Desktop App (macOS, Windows, Linux)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-before-release:
    name: Full Verification Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm --filter @vcat/desktop build
      - run: pnpm --filter @vcat/desktop exec playwright install chromium
      - run: pnpm --filter @vcat/desktop exec playwright test --reporter=list

  release-matrix:
    name: Build & Publish (${{ matrix.os }})
    needs: verify-before-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pnpm --filter @vcat/desktop package:mac
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            script: pnpm --filter @vcat/desktop package:win
            artifacts: |
              apps/desktop/release/*.exe
          - os: ubuntu-latest
            script: pnpm --filter @vcat/desktop package:linux
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop Installer
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.artifacts }}
